<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" width="100%" height="100%">
  <defs>
    <linearGradient id="peBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2540" />
      <stop offset="100%" stop-color="#1e4976" />
    </linearGradient>
    <linearGradient id="peAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="rollerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Precision Roller Icon Mark -->
  <g transform="translate(10, 10)">
    <!-- Outer Precision Ring -->
    <circle cx="40" cy="40" r="38" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Balance Dynamic Orbit Arc -->
    <path d="M 12 40 A 28 28 0 0 1 68 40" fill="none" stroke="url(#peAmberGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 68 40 A 28 28 0 0 1 12 40" fill="none" stroke="url(#peAmberGrad)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="4 6"/>
    
    <!-- Precision Roller Cylinder 3D View -->
    <rect x="22" y="24" width="36" height="32" rx="4" fill="url(#peBlueGrad)" filter="url(#shadow)"/>
    <!-- Roller highlight ribs -->
    <line x1="28" y1="24" x2="28" y2="56" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
    <line x1="36" y1="24" x2="36" y2="56" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
    <line x1="44" y1="24" x2="44" y2="56" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
    <line x1="52" y1="24" x2="52" y2="56" stroke="#0ea5e9" stroke-width="1" opacity="0.5"/>

    <!-- Central Shaft / Bearing Ends -->
    <rect x="14" y="36" width="8" height="8" rx="2" fill="url(#peAmberGrad)"/>
    <rect x="58" y="36" width="8" height="8" rx="2" fill="url(#peAmberGrad)"/>
    
    <!-- Concentric Center Point -->
    <circle cx="40" cy="40" r="3" fill="#ffffff"/>
  </g>

  <!-- Typography -->
  <g transform="translate(105, 0)">
    <!-- PRAGATI -->
    <text x="0" y="48" font-family="'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="2.5" fill="#0a2540">
      PRAGATI
    </text>
    <!-- ENGINEERS -->
    <text x="210" y="48" font-family="'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="2" fill="url(#peAmberGrad)">
      ENGINEERS
    </text>
    
    <!-- Divider Line -->
    <line x1="0" y1="58" x2="400" y2="58" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="0" y="57" width="60" height="3.5" rx="1.5" fill="url(#peAmberGrad)"/>
    
    <!-- Tagline -->
    <text x="0" y="76" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="3.2" fill="#64748b" text-transform="uppercase">
      PRECISION INDUSTRIAL ROLLERS
    </text>
  </g>
</svg>
